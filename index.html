'use strict';
const $=s=>document.getElementById(s),names=['Sketch','Site & massing','Structure','Envelope','MEP coordination','Documentation','Commissioning','Digital twin'];
// Each brief pairs a measured constraint with a decision and discipline-specific feedback.
const cases=[
{title:'Daylight office',place:'Seattle · Workplace design',source:'Bullitt Center',url:'https://bullittcenter.org/building/building-features/building-neurology/',fact:'The Bullitt Center uses a building management system to coordinate shading, ventilation and other systems. This office exercise explores how early design decisions affect the information an operator needs.',jobs:[
['Shape the floor plate','Architectural technologist','Sketch a rectangular office beside a fixed 24 m street edge. The tenant needs 264–312 m² per floor, with desks within 6.5 m of a long façade.','Plate depth','m',8,18,16,11,13,'Daylight depth','Which drawing best tests both constraints?','Dimensioned plan with desk bands|Street perspective with materials|Reflected ceiling plan alone','The plan locates workstations and gives a measurable area.','A perspective hides distances.|Ceiling layouts do not establish workstation positions.'],
['Set the roof datum','Planning designer','The brief calls for three equal storeys. A 12 m study envelope caps the roof datum. Reserve at least 3.6 m floor-to-floor for structure and services.','Floor-to-floor height','dm',30,46,43,36,40,'Datum','Which drawing communicates the vertical allowance?','Building section tied to level datums|Door hardware schedule|Site planting plan','A section relates occupied space, service zones and the roof to common levels.','Hardware schedules describe door fittings.|Planting plans locate landscape elements.'],
['Coordinate a repeatable bay','Structural coordinator','The primary frame runs along the 24 m frontage. Use equal bays, each 5–7 m long, with no short end bay. This is a layout study.','Bay count','bays',2,8,3,4,4,'Structural grid','What should the team trace before sizing members?','Slab to beam to column to foundation|Colour coding to room tags|Façade panel to finish schedule','The load path identifies the supporting elements and transfer points.','Tags do not transfer load.|Finish records do not establish structural support.'],
['Tune the sun screen','Envelope designer','A mock-up study found a 0.8–1.0 m projection preserves useful daylight while shading the test glazing. Set the projection for this façade.','Screen projection','dm',2,15,4,8,10,'Brise-soleil','Which detail needs review where the screen meets the wall?','Continuity of insulation and water control at brackets|Interior carpet pattern|Lift destination display','Brackets cross the enclosure and need coordinated thermal and water-control details.','Floor finishes do not resolve the penetration.|Lift controls address another system.'],
['Route the supply main','Mechanical coordinator','A beam crosses the duct route at soffit elevation 3.20 m. The duct is 0.40 m deep. Keep 0.10 m above it and at least 2.60 m below its underside.','Duct underside','dm',22,34,30,26,27,'Hard clash','How should the routing issue be issued?','Locate the clash by grid and level with both element IDs|Hide the beam in the mechanical view|Move the structural grid without review','A traceable issue lets both disciplines approve and verify the change.','Hiding geometry leaves the clash.|Changing a grid affects other disciplines.'],
['Issue the façade package','BIM coordinator','The drawing register lists revision 4 for the façade package. The site copy is revision 2. Align the issue with the approved register.','Issue revision','rev',1,6,2,4,4,'Common data environment','Which record accompanies the issue?','Transmittal listing sheets, revision and recipients|Unversioned screenshot|A verbal instruction alone','The transmittal records which information was issued and to whom.','A screenshot lacks controlled issue metadata.|A verbal instruction lacks a retrievable issue record.'],
['Verify the daylight sensor','Commissioning agent','A reference meter reads 480 lux. The installed sensor reads 540 lux. Apply an additive correction so the adjusted reading is within 10 lux of the reference.','Sensor offset','lux',-90,0,-20,-70,-50,'Calibration','Which test verifies the control sequence?','Vary the light input and record the shade response|Check only the model colour|Accept the sensor because it has a serial number','Functional testing connects an input change to an observed actuator response.','A material colour does not test control behaviour.|Identification alone is not performance evidence.'],
['Connect the operational twin','Facilities technologist','The west blind reports glare events lasting 6 minutes. The operator requests at least three samples per event and storage allows no interval below 2 minutes.','Sampling interval','min',1,8,5,2,2,'Point mapping','Bind the telemetry stream to its maintained asset.','BL-W01 · west blind actuator|AHU-01 · roof air handler|MTR-W · water meter','The stable actuator ID links observations, model location and service history.','The air handler serves ventilation.|The meter measures water consumption.']
]},
{title:'Kiln hall reuse',place:'Toronto · Adaptive reuse',source:'Evergreen Brick Works',url:'https://www.canada.ca/en/canadian-heritage/news/2018/08/investing-in-cultural-infrastructure-in-toronto.html',fact:'At Evergreen Brick Works, a former industrial site in the Don Valley, the Kiln Building was repurposed for cultural programming. This separate training model explores reuse, survey evidence and operations.',jobs:[
['Sketch a reversible insertion','Heritage technologist','Fit a freestanding studio into a 12 m wide retained hall. Keep 2 m clear on both sides and provide at least 7 m of studio width.','Studio width','m',4,11,10,7,8,'Adaptive reuse','What provides a reliable base for this sketch?','Measured survey distinguishing retained and proposed work|Historic postcard alone|Supplier furniture catalogue','A measured base identifies the available space and the fabric to retain.','A postcard cannot establish reliable dimensions.|A catalogue cannot locate existing walls.'],
['Set the gallery platform','Site coordinator','The scenario survey uses a local zero. An exhibition platform must sit at least 0.6 m above it and meet an existing landing no higher than 0.8 m.','Platform level','dm',0,12,3,6,8,'Benchmark','What keeps the platform and landing elevations comparable?','Use the same verified survey benchmark|Measure from separate floor finishes|Match the lines visually in a perspective','A common benchmark ties both elevations to the same reference.','Separate finishes can have different elevations.|Perspective is not a survey reference.'],
['Locate the independent frame','Structural coordinator','Survey stations are measured along the hall. The retained kiln occupies stations 4–7 m. The permitted support strip is at 8–9 m.','Frame station','m',3,11,6,8,9,'Intervention','Which investigation comes before adopting the support line?','Verify the substrate and existing foundations|Assume the floor topping can carry columns|Approve the grid from a photograph','The support line needs evidence of a viable load path into the ground.','A topping is not evidence of bearing capacity.|A photograph does not reveal foundations.'],
['Detail the secondary lining','Envelope specialist','A mock-up requires a 40–60 mm drained cavity behind a reversible inner panel. The retained masonry face must stay accessible at inspection points.','Cavity depth','mm',10,90,20,40,60,'Rainscreen cavity','What must the junction detail show?','A drain path and accessible inspection point|A sealed pocket at the base|An unlabelled finish swatch','The detail shows where incidental water goes and how the assembly is inspected.','A closed pocket can retain water.|A swatch contains no junction information.'],
['Coordinate the service spine','Building services coordinator','A gallery installation reaches 2.8 m. Set the service tray above it with 0.2 m separation. The conservation zone begins above 3.2 m; the tray is 0.1 m deep.','Tray underside','dm',25,36,28,30,31,'Clearance clash','How should the tray be supported in this scheme?','Coordinate hangers with the new independent frame|Fix into historic fabric without investigation|Leave supports out of the model and tender','Independent supports respect the conservation brief and make the load path reviewable.','Unverified anchors risk damage to existing fabric.|Omitted supports leave the coordination unresolved.'],
['Reconcile the door schedule','Architectural technologist','Survey sheet A-201 identifies five retained openings and two new doors. The handover register must include each of these openings once.','Register entries','doors',4,10,5,7,7,'Door schedule','Which identifiers preserve traceability?','Unique door marks linked to plan and condition records|One shared mark for every door|Only the room paint colour','Unique marks connect each surveyed opening to its condition and scope.','A shared mark cannot distinguish individual assets.|Colour cannot identify openings reliably.'],
['Test the water-level alarm','Commissioning agent','The test tank is at 420 mm. Its probe reads 450 mm. Set an additive offset that puts the adjusted reading within 5 mm of the test value.','Probe offset','mm',-50,0,-10,-35,-25,'Functional performance test','What completes the alarm test?','Trigger the test level and confirm receipt at the operator station|Only inspect the probe label|Mute the alarm and sign off','An end-to-end test checks the sensor, signal path and operator notification.','The label does not verify transmission.|A muted alarm cannot demonstrate notification.'],
['Hand the hall to operations','Facilities manager','A simulated sump event lasts 12 minutes. Capture at least four readings during it. The logger permits intervals of 3 minutes or longer.','Logging interval','min',1,10,7,3,3,'Asset information model','Choose the correct observation-to-asset link.','LS-01 · sump level probe|L-02 · display lighting circuit|D-07 · gallery door','The level probe connects observations to the sump location and maintenance record.','Lighting telemetry describes another system.|A door record has no sump-level measurement.']
]}];
const vocab={
'Practice & project delivery':[
['Client','Sets the project brief, budget and acceptance criteria.'],['Architect','Leads architectural design and integrates discipline inputs.'],['Architectural technologist','Develops buildable assemblies, coordinated models and technical documents.'],['Consulting engineer','Develops and verifies discipline-specific engineering designs.'],['Contractor','Plans and executes construction using the contract information.'],['Facilities manager','Manages operation, maintenance and asset information.'],['Program','List of required spaces, activities and relationships.'],['Schematic design','Tests broad options against the brief.'],['Design development','Resolves the selected concept into coordinated systems.'],['Construction documents','Drawings and specifications describing the work to be procured and built.'],['RFI','Request for information tracking a question and its formal response.'],['Submittal','Product or fabrication information submitted for review.'],['Transmittal','Dated record of an information issue and its recipients.']],
'Site, space & representation':[
['Benchmark','Survey reference with an established elevation.'],['Datum','Reference plane or level from which dimensions are measured.'],['Setback','Distance between a building and a defined site boundary or control line.'],['Footprint','Area covered by the building in plan.'],['Massing','Three-dimensional arrangement of building volumes.'],['Adjacency','Required relationship between spaces or functions.'],['Plan','Horizontal cut looking down through a building.'],['Section','Vertical cut revealing spatial and assembly relationships.'],['Elevation','Orthographic view of a building face.'],['Axonometric','Parallel projection showing three-dimensional form.'],['Daylight depth','Distance from an opening into a space considered in daylight design.'],['Adaptive reuse','Conversion of existing fabric to support a new use.'],['Intervention','New work that alters or adds to an existing building.']],
'Structure & enclosure':[
['Structural grid','Reference lines used to locate columns, walls and framing.'],['Bay','Space between successive grid or support lines.'],['Load path','Sequence of elements carrying forces to the ground.'],['Dead load','Weight of permanent construction and fixed equipment.'],['Live load','Variable imposed load associated with use.'],['Beam','Member that spans between supports and resists transverse loads.'],['Column','Member that carries loads primarily along its length.'],['Slab','Plate-like floor or roof element.'],['Footing','Foundation element distributing supported load to the bearing material.'],['Diaphragm','Floor or roof system transferring in-plane forces to lateral supports.'],['Brise-soleil','Exterior shading screen designed to intercept sunlight.'],['Mullion','Framing member separating glazing panels.'],['Thermal bridge','Localized path of increased heat transfer through an enclosure.'],['Air barrier','Continuous system limiting unwanted air movement through the envelope.'],['Flashing','Material directing water away from a joint or opening.'],['Rainscreen cavity','Space behind cladding that supports drainage and, where designed, ventilation.']],
'Building services & coordination':[
['MEP','Mechanical, electrical and plumbing disciplines.'],['AHU','Air handling unit that conditions and distributes air.'],['Riser','Vertical distribution run for services.'],['Soffit','Underside of a construction element.'],['Plenum','Air distribution chamber or space.'],['Hard clash','Physical intersection of modeled components.'],['Clearance clash','Violation of required access or separation space.'],['Federated model','Combined view of linked discipline models.'],['Coordination issue','Tracked conflict with a location, responsible party and resolution status.'],['Reflected ceiling plan','Plan convention showing the ceiling layout and overhead components.']],
'Information, handover & operations':[
['BIM','Building information modelling links geometry with structured project information.'],['IFC','Industry Foundation Classes, an open schema for built-asset information exchange.'],['GUID','Globally unique identifier used to reference an object across data exchanges.'],['Common data environment','Agreed process and environment for managing shared project information.'],['Door schedule','Tabular record of door marks, locations and specified properties.'],['Specification','Written requirements for products, execution and performance.'],['Commissioning','Process of verifying and documenting that systems meet project requirements.'],['Calibration','Comparison against a reference to establish measurement behaviour.'],['Functional performance test','Documented exercise of a system through specified operating sequences.'],['Asset information model','Organized information supporting operation of a built asset.'],['Point mapping','Association of an instrument or control point with its intended asset and quantity.'],['BMS','Building management system monitoring or controlling building services.'],['Telemetry','Time-stamped measurements transmitted from a monitored system.'],['Digital twin','Digital representation linked with observations of its physical counterpart.'],['Work order','Record assigning, tracking and closing a maintenance action.']]};
let c=0,n=0,mode='Model',yaw=-.64,tilt=.48,zoom=1,choice=null,val,note='',storeOK=true;
const fresh=()=>({records:[],drafts:{},attempts:{}});let data=[fresh(),fresh()];try{const old=JSON.parse(localStorage.getItem('fieldwork.v1'));if(old&&old.data?.length===2&&old.data.every(a=>Array.isArray(a.records)&&a.records.length<=8&&a.drafts&&a.attempts)){data=old.data;c=old.c===1?1:0}}catch{}const C=()=>cases[c],S=()=>data[c],J=()=>C().jobs[n],rec=()=>S().records[n],esc=s=>String(s).replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));
function save(){try{localStorage.setItem('fieldwork.v1',JSON.stringify({data,c}))}catch{storeOK=false}}
function enter(i){n=i;let d=rec()||S().drafts[n]||{};val=d.val??J()[7];choice=d.choice??null;note=d.note||'';mode='Model';render()}
function draft(){if(!rec()){S().drafts[n]={val,choice,note};save()}}
function home(){yaw=-.64;tilt=.48;zoom=1;draw()}
function zoomBy(k){zoom=Math.max(.55,Math.min(2,zoom*k));draw()}
function sel(i){choice=i;draft();document.querySelectorAll('.choices button').forEach(b=>b.classList.toggle('active',+b.dataset.i===i));$('review').disabled=false;$('feedback').textContent=''}
function advice(){let j=J();return c===0?['Floor area '+(val*24)+' m² · maximum distance to a long façade '+(val/2)+' m','Roof datum '+(val*.3).toFixed(2)+' m','Equal span '+(24/val).toFixed(2)+' m','Projection '+(val/10).toFixed(1)+' m','Duct top '+(val/10+.4).toFixed(2)+' m · beam soffit 3.20 m','Register calls for revision 4','Adjusted reading '+(540+val)+' lux','Samples per event '+(6/val).toFixed(1)][n]:['Side clearance '+((12-val)/2).toFixed(1)+' m','Platform datum +'+(val/10).toFixed(1)+' m','Frame at survey station '+val+' m','Drained cavity '+val+' mm','Tray top '+(val/10+.1).toFixed(2)+' m','Expected count = retained + new','Adjusted reading '+(450+val)+' mm','Readings per event '+(12/val).toFixed(1)][n]}
function render(){hierarchy();let j=J(),r=rec(),a=j[12].split('|'),order=[[1,0,2],[2,1,0],[0,2,1]][(n+c)%3];$('casePick').value=c;$('subtitle').textContent=C().place+' · Inspired by '+C().source;$('modelName').textContent=C().title+' / study model';$('modelState').textContent=['Concept','Massing','Frame','Envelope','Services','Issue set','Test rig','Twin'][n];$('status').textContent=S().records.length+'/8 approved';$('phases').innerHTML=names.map((t,i)=>'<button '+(i>S().records.length?'disabled':'')+' class="'+(i===n?'active':'')+'" onclick="enter('+i+')">'+(i<S().records.length?'✓ ':('0'+(i+1)+' '))+t+'</button>').join('');$('views').innerHTML=(n===0?['Model','Plan','Sketch','Explode']:['Model','Plan','Explode']).map(x=>'<button class="'+(x===mode?'active':'')+'" onclick="changeView(this.textContent)">'+x+'</button>').join('');
$('mission').innerHTML='<div class="eyebrow">Stage 0'+(n+1)+' / '+names[n]+'</div><h2>'+j[0]+'</h2><span class="note">Your role · '+j[1]+'</span><div class="evidence">'+j[2]+'</div><div class="control"><label for="slider">'+j[3]+' <strong id="reading"></strong></label><input id="slider" type="range" min="'+j[5]+'" max="'+j[6]+'" value="'+val+'" '+(r?'disabled':'')+'><small id="measure"></small></div><h3>'+j[11]+'</h3><div class="choices">'+order.map((i,k)=>'<button data-i="'+i+'" '+(r?'disabled':'')+' class="'+(choice===i?'active':'')+'" onclick="sel('+i+')"><b>'+String.fromCharCode(65+k)+'</b>'+a[i]+'</button>').join('')+'</div><details '+(note?'open':'')+'><summary class="note">Design rationale · optional</summary><textarea id="rationale" maxlength="600" rows="2" placeholder="Record the evidence behind your decision." '+(r?'disabled':'')+'>'+esc(note)+'</textarea></details><div id="feedback" role="status" class="notice">'+(r?'Approved · '+r.points+' / 100 points. '+j[13]:'')+'</div><button id="review" class="primary wide" style="margin-top:10px" '+(!r&&choice===null?'disabled':'')+' onclick="submitStage()">'+(r?(n===7?'Open handover record':'Continue to '+names[n+1]):'Submit for review')+' →</button>'; $('slider').oninput=e=>{val=+e.target.value;draft();measure();draw();$('feedback').textContent=''};$('rationale').oninput=e=>{note=e.target.value;draft()};let termButton=document.createElement('button');termButton.textContent='Field term · '+j[10];termButton.style.cssText='margin-top:12px;font-size:12px';termButton.onclick=()=>guide(j[10]);$('mission').append(termButton);measure();draw()}
function hierarchy(){let levels=c?['Kiln hall reuse','Don Valley study site','Exhibition hall','Ground level','Service zone','LS-01 · Sump level probe','Observation · water level [mm]']:['Daylight office','Seattle study site','Office building','Ground level','West perimeter zone','BL-W01 · Blind actuator','Observation · associated light sensor [lux]'];let labels=['Project','Site','Building','Storey','Space','Maintained asset','Linked data'];let html='<p class="note">Expand each level to follow one operational asset through the model.</p>';levels.forEach((v,i)=>{html+='<details style="margin:5px 0 5px 9px;padding-left:6px;border-left:2px solid #c3d0b9" '+(i<2?'open':'')+'><summary>'+labels[i]+' · '+v+'</summary>'});html+='<p class="note">'+(rec()&&n===7?'Open the handover record for the time series.':'Commissioning and point mapping provide this record in the final stage.')+'</p>'+'</details>'.repeat(levels.length);$('tree').innerHTML=html}
function measure(){$('reading').textContent=' · '+val+' '+J()[4];$('measure').textContent=advice()}
function submitStage(){if(rec()){if(n===7)journal();else enter(n+1);return}let j=J(),wrong=val<j[8]||val>j[9];if(wrong||choice!==0){S().attempts[n]=(S().attempts[n]||0)+1;save();$('feedback').textContent=[wrong?'Revise '+j[3].toLowerCase()+'. '+advice()+'. Compare this with the stated limits.':'',choice>0?j[14].split('|')[choice-1]:''].filter(Boolean).join(' ');return}S().records.push({val,choice,note,points:Math.max(40,100-10*(S().attempts[n]||0))});save();render()}
function changeView(v){mode=v;render()}
